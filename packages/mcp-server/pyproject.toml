[project]
name = "quality-gate-mcp"
version = "0.1.0"
description = "Stateless MCP server exposing deterministic dev tools (git, GitHub API, ripgrep) for PR review"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.0",
    # FR-P18: RS256 JWTs for GitHub App installation tokens.
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
quality-gate-mcp = "quality_gate_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gate_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
