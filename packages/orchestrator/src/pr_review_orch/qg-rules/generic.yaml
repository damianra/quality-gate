# FR-O33 curated semgrep ruleset — generic family (language-agnostic
# regex rules). Vendored into qg-sandbox at /opt/qg-rules; scans run
# with --network none. Severity drives the finding mapping
# (ERROR->warning, WARNING/INFO->info). Every rule carries provenance
# metadata (see PROVENANCE.md).
rules:
  - id: generic-curl-pipe-shell
    pattern-regex: curl[^\n|]*\|\s*(sudo\s+)?(ba)?sh\b
    message: curl | sh pattern — remote code execution from an
      unpinned source.
    languages: [generic]
    severity: ERROR
    metadata: {source: qg, cwe: 494}

  - id: generic-wget-pipe-shell
    pattern-regex: wget[^\n|]*\|\s*(sudo\s+)?(ba)?sh\b
    message: wget | sh pattern — remote code execution from an
      unpinned source.
    languages: [generic]
    severity: ERROR
    metadata: {source: qg, cwe: 494}

  - id: generic-private-key-block
    pattern-regex: -----BEGIN (RSA |EC |OPENSSH |PGP |DSA )?PRIVATE KEY( BLOCK)?-----
    message: private key material committed in source.
    languages: [generic]
    severity: ERROR
    metadata: {source: qg, cwe: 312}

  - id: generic-yaml-python-object
    pattern-regex: '!!python/(object|name|module)'
    message: PyYAML python/object tag — deserializes to arbitrary code
      on load.
    languages: [generic]
    severity: ERROR
    metadata: {source: qg, cwe: 502}

  - id: generic-curl-insecure-flag
    pattern-regex: '\b(curl\b[^\n|]*\s(-k|--insecure)\b|wget\b[^\n|]*\s--no-check-certificate\b)'
    message: curl -k / wget --no-check-certificate disables TLS
      verification — MITM exposure.
    languages: [generic]
    severity: ERROR
    metadata: {source: qg, cwe: 295}

  - id: generic-base64-pipe-shell
    pattern-regex: '\bbase64\s+(-d|--decode|di?)\b[^|\n]*\|\s*(ba|z|fi|da)?sh\b'
    message: base64 payload decoded into a shell — obfuscated command
      execution.
    languages: [generic]
    severity: WARNING
    metadata: {source: qg, cwe: 78}

  - id: generic-chmod-world-writable
    pattern-regex: '\bchmod\s+(-[a-zA-Z]+\s+)*(0?777|a\+rwx|[augo]{1,3}\+o?\+?[rwx]*w)\b'
    message: chmod making files world-writable (777/a+rwx/+w) —
      permissive mode invites tampering.
    languages: [generic]
    severity: WARNING
    metadata: {source: qg, cwe: 732}

  - id: generic-ssh-permit-root
    pattern-regex: '(?i)^\s*PermitRootLogin\s+(yes|true)\b'
    message: sshd permits direct root login — disable and use a
      named account + sudo instead.
    languages: [generic]
    severity: WARNING
    metadata: {source: qg, cwe: 250}

  - id: generic-gha-pull-request-target
    pattern-regex: '\bpull_request_target\b'
    message: pull_request_target runs in the privileged base-repo
      context with secrets — never check out or execute PR-head code
      in this workflow.
    languages: [generic]
    severity: WARNING
    metadata: {source: qg, cwe: 829}

  - id: generic-gha-expression-injection
    pattern-regex: '\$\{\{\s*github\.(head_ref|event\.(issue|pull_request|comment|review|reviews|discussion|discussions|commits|pages|head_commit|workflow_run|merge_group))\b'
    message: attacker-controlled GitHub field interpolated into the
      workflow — script-injection risk inside shell steps; bind it
      through an env var instead.
    languages: [generic]
    severity: WARNING
    metadata: {source: qg, cwe: 94}

  - id: generic-xml-xxe-entity
    pattern-regex: '<!(ENTITY|DOCTYPE)[^>\n]*\sSYSTEM\b'
    message: external XML entity/doctype — XXE payloads read local
      files and hit internal endpoints on parsers without hardening.
    languages: [generic]
    severity: WARNING
    metadata: {source: qg, cwe: 611}
