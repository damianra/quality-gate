# FR-O29 curated semgrep ruleset — vendored into qg-sandbox at
# /opt/qg-rules so scans run with --network none. High-signal, low-noise
# rules across the supported ecosystems; severity drives the finding
# mapping (ERROR->warning, WARNING/INFO->info).
rules:
  - id: python-eval-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: eval()/exec() on dynamic input — code-injection risk.
    languages: [python]
    severity: ERROR

  - id: python-subprocess-shell
    patterns:
      - pattern-either:
          - pattern: subprocess.$F(..., shell=True, ...)
          - pattern: os.system(...)
    message: shell command built in Python — injection risk if input
      is user-controlled.
    languages: [python]
    severity: ERROR

  - id: python-requests-verify-false
    pattern: requests.$M(..., verify=False, ...)
    message: TLS verification disabled — MITM exposure.
    languages: [python]
    severity: ERROR

  - id: python-unsafe-deserialize
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: yaml.load(..., Loader=yaml.Loader)
          - pattern: marshal.loads(...)
    message: unsafe deserialization of untrusted data.
    languages: [python]
    severity: ERROR

  - id: python-weak-hash
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: weak hash (md5/sha1) — not for passwords or integrity.
    languages: [python]
    severity: WARNING

  - id: js-eval-usage
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
    message: eval()/new Function() on dynamic input — code-injection
      risk.
    languages: [javascript, typescript]
    severity: ERROR

  - id: js-child-process-string
    pattern-either:
      - pattern: $CP.exec($CMD, ...)
      - pattern: $CP.execSync($CMD, ...)
    message: child_process.exec* with a string command — injection
      risk when $CMD is not a literal.
    languages: [javascript, typescript]
    severity: WARNING

  - id: js-dangerous-html
    pattern-either:
      - pattern: "<$EL dangerouslySetInnerHTML={{__html: $H}} />"
      - pattern: "$EL.innerHTML = $H"
    message: raw HTML injection — XSS risk if input is user-controlled.
    languages: [javascript, typescript]
    severity: WARNING

  - id: go-command-injection
    pattern: exec.Command($SH, "-c", $CMD)
    message: sh -c with a non-literal command — injection risk.
    languages: [go]
    severity: ERROR

  - id: go-weak-hash
    pattern-either:
      - pattern: md5.New(...)
      - pattern: md5.Sum(...)
      - pattern: sha1.New(...)
      - pattern: sha1.Sum(...)
    message: weak hash (md5/sha1) — not for passwords or integrity.
    languages: [go]
    severity: WARNING

  - id: generic-curl-pipe-shell
    pattern-regex: curl[^\n|]*\|\s*(sudo\s+)?(ba)?sh\b
    message: curl | sh pattern — remote code execution from an
      unpinned source.
    languages: [generic]
    severity: ERROR

  - id: generic-private-key-block
    pattern-regex: -----BEGIN (RSA |EC |OPENSSH |PGP |DSA )?PRIVATE KEY( BLOCK)?-----
    message: private key material committed in source.
    languages: [generic]
    severity: ERROR
