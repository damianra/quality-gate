# FR-O33 curated semgrep ruleset — python family. Vendored into
# qg-sandbox at /opt/qg-rules; scans run with --network none. Severity
# drives the finding mapping (ERROR->warning, WARNING/INFO->info).
# Every rule carries provenance metadata (see PROVENANCE.md).
rules:
  # --- qg seed ---------------------------------------------------------- #
  - id: python-eval-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: eval()/exec() on dynamic input — code-injection risk.
    languages: [python]
    severity: ERROR
    metadata: {source: qg, cwe: 95}

  - id: python-subprocess-shell
    patterns:
      - pattern-either:
          - pattern: subprocess.$F(..., shell=True, ...)
          - pattern: os.system(...)
    message: shell command built in Python — injection risk if input
      is user-controlled.
    languages: [python]
    severity: ERROR
    metadata: {source: qg, cwe: 78}

  - id: python-requests-verify-false
    pattern: requests.$M(..., verify=False, ...)
    message: TLS verification disabled — MITM exposure.
    languages: [python]
    severity: ERROR
    metadata: {source: qg, cwe: 295}

  - id: python-unsafe-deserialize
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: yaml.unsafe_load(...)
          - pattern: yaml.load(...)
          - pattern: marshal.loads(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.loader.SafeLoader, ...)
      - pattern-not: yaml.load(..., Loader=yaml.loader.CSafeLoader, ...)
    message: unsafe deserialization of untrusted data.
    languages: [python]
    severity: ERROR
    metadata: {source: qg, cwe: 502}

  - id: python-weak-hash
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: weak hash (md5/sha1) — not for passwords or integrity.
    languages: [python]
    severity: WARNING
    metadata: {source: qg, cwe: 327}

  # --- bandit ports ----------------------------------------------------- #
  - id: python-hardcoded-password-kwarg
    patterns:
      - pattern: $F(..., $KW="...", ...)
      - metavariable-regex:
          metavariable: $KW
          regex: "^(password|passwd|pwd|secret|token|api_key|apikey)$"
    message: credential passed as a hardcoded keyword argument.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B106, cwe: 798}

  - id: python-try-except-pass
    pattern-either:
      - pattern: |
          try:
            ...
          except:
            pass
      - pattern: |
          try:
            ...
          except $E:
            pass
      - pattern: |
          try:
            ...
          except $E as $X:
            pass
    message: except block silently swallows errors — bugs and failures
      become invisible.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B110, cwe: 390}

  - id: python-ssl-unverified-context
    pattern: ssl._create_unverified_context(...)
    message: unverified TLS context — certificate checks disabled.
    languages: [python]
    severity: ERROR
    metadata: {source: bandit, ref: B323, cwe: 295}

  - id: python-ssl-obsolete-protocol
    pattern-either:
      - pattern: ssl.PROTOCOL_SSLv2
      - pattern: ssl.PROTOCOL_SSLv3
      - pattern: ssl.PROTOCOL_TLSv1
      - pattern: ssl.PROTOCOL_TLSv1_1
    message: obsolete SSL/TLS protocol version — known-broken transport
      security.
    languages: [python]
    severity: ERROR
    metadata: {source: bandit, ref: B502, cwe: 327}

  - id: python-tempfile-mktemp
    pattern-either:
      - pattern: tempfile.mktemp(...)
      - pattern: os.tempnam(...)
      - pattern: os.tmpnam(...)
    message: insecure temp-file name — use NamedTemporaryFile/mkstemp;
      mktemp races a symlink attack.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B306, cwe: 377}

  - id: python-chmod-permissive
    patterns:
      - pattern-either:
          - pattern: os.chmod($P, 0o777)
          - pattern: os.chmod($P, 0o666)
          - pattern: os.chmod($P, stat.S_IRWXO)
    message: permissive file mode — world-writable/readable files leak
      or invite tampering.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B103, cwe: 732}

  - id: python-weak-cipher
    pattern-either:
      - pattern: DES.new(...)
      - pattern: ARC2.new(...)
      - pattern: ARC4.new(...)
      - pattern: Blowfish.new(...)
      - pattern: XOR.new(...)
      - pattern: Crypto.Cipher.DES.new(...)
      - pattern: Crypto.Cipher.ARC2.new(...)
      - pattern: Crypto.Cipher.ARC4.new(...)
      - pattern: Crypto.Cipher.Blowfish.new(...)
    message: weak cipher (DES/RC2/RC4/Blowfish/XOR) — use AES-GCM or
      ChaCha20.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B305, cwe: 327}

  - id: python-paramiko-autoadd-policy
    pattern-either:
      - pattern: paramiko.AutoAddPolicy(...)
      - pattern: paramiko.WarningPolicy(...)
    message: SSH host-key verification disabled — MITM exposure on
      first contact.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B507, cwe: 295}

  - id: python-sql-injection-format
    patterns:
      - pattern-either:
          - pattern: $X.$M("..." + ...)
          - pattern: $X.$M("...".format(...), ...)
          - pattern: $X.$M("..." % ...)
      - metavariable-regex:
          metavariable: $M
          regex: "^(execute|executemany|executescript)$"
    message: SQL statement built by string formatting — injection risk;
      use parameters.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B608, cwe: 89}

  - id: python-xml-vulnerable-parser
    pattern-either:
      - pattern-regex: '^\s*(import|from)\s+xml\.(sax|dom\.minidom|dom\.pulldom|dom\.expatbuilder)\b'
      - pattern: etree.$F(..., resolve_entities=True, ...)
    message: XML parser vulnerable to entity-expansion/XXE — prefer
      defusedxml or resolve_entities=False.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B405, cwe: 611}

  - id: python-flask-debug
    pattern: $APP.run(..., debug=True, ...)
    message: app.run(debug=True) — the Werkzeug debugger enables code
      execution through the browser console.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B201, cwe: 489}

  - id: python-bind-all-interfaces
    pattern-either:
      - pattern: $S.bind(("0.0.0.0", ...))
      - pattern: $F(..., host="0.0.0.0", ...)
      - pattern: $F(..., ("0.0.0.0", ...), ...)
    message: binding to 0.0.0.0 exposes the service on every interface.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B104, cwe: 1327}

  - id: python-requests-no-timeout
    patterns:
      - pattern: requests.$M(...)
      - pattern-not: requests.$M(..., timeout=..., ...)
      - metavariable-regex:
          metavariable: $M
          regex: "^(get|post|put|delete|head|patch|options|request)$"
    message: requests call without timeout — hangs forever on a stuck
      peer.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B113, cwe: 400}

  - id: python-tarfile-unsafe-extract
    patterns:
      - pattern-either:
          - pattern: $T.extractall(...)
          - pattern: tarfile.$F(...).extractall(...)
      - pattern-not: $T.extractall(..., filter=..., ...)
      - pattern-not: tarfile.$F(...).extractall(..., filter=..., ...)
    message: tarfile.extractall without filter — member paths escape
      the target directory (zip-slip).
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B202, cwe: 22}

  - id: python-jinja2-autoescape-off
    pattern-either:
      - pattern: jinja2.Environment(..., autoescape=False, ...)
      - pattern: jinja2.sandbox.SandboxedEnvironment(..., autoescape=False, ...)
      - pattern: Environment(..., autoescape=False, ...)
      - pattern: SandboxedEnvironment(..., autoescape=False, ...)
    message: Jinja2 autoescape disabled — template output is unescaped,
      XSS risk.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B701, cwe: 79}

  - id: python-ftplib-cleartext
    pattern-either:
      - pattern: ftplib.FTP(...)
      - pattern: FTP(...)
    message: ftplib sends credentials and data in cleartext — use
      FTP_TLS/SFTP instead.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B402, cwe: 319}

  - id: python-telnetlib-cleartext
    pattern-either:
      - pattern: telnetlib.Telnet(...)
      - pattern: Telnet(...)
    message: telnet sends credentials and data in cleartext — use SSH
      (paramiko) instead.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B401, cwe: 319}

  - id: python-hardcoded-password-string
    patterns:
      - pattern-either:
          - pattern: '$VAR = "..."'
          - pattern: '$VAR: $T = "..."'
      - metavariable-regex:
          metavariable: $VAR
          regex: "(?i).*(password|passwd|pwd|secret|token|api_?key|access_?key|credential).*"
    message: credential-looking literal assigned to a secret-named
      variable — move it to env vars or a secrets store.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B105, cwe: 798}

  - id: python-hardcoded-password-default
    patterns:
      - pattern-either:
          - pattern: |
              def $F(..., $KW="...", ...):
                ...
          - pattern: |
              def $F(..., $KW: $T="...", ...):
                ...
      - metavariable-regex:
          metavariable: $KW
          regex: "(?i).*(password|passwd|pwd|secret|token|api_?key|access_?key|credential).*"
    message: credential-looking literal as a keyword default — callers
      inherit the hardcoded secret.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B107, cwe: 798}

  - id: python-random-insecure
    patterns:
      - pattern: random.$M(...)
      - metavariable-regex:
          metavariable: $M
          regex: "^(random|randint|randrange|randbytes|choice|choices|shuffle|sample|uniform|triangular|betavariate|expovariate|gammavariate|gauss|lognormvariate|normalvariate|vonmisesvariate|paretovariate|weibullvariate|getrandbits|seed|Random)$"
    message: random.* PRNG is not cryptographically secure — use
      secrets/os.urandom for tokens, keys and IDs.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B311, cwe: 338}

  - id: python-urllib-request-open
    pattern-either:
      - pattern: urllib.request.urlopen(...)
      - pattern: urllib.request.urlretrieve(...)
      - pattern: urllib.urlopen(...)
      - pattern: urllib.urlretrieve(...)
      - pattern: urlopen(...)
      - pattern: urlretrieve(...)
    message: urllib urlopen/urlretrieve fetch arbitrary schemes
      (http/file/ftp) — audit for SSRF and path access; prefer
      requests with an allowlisted URL.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B310, cwe: 939}

  - id: python-mark-safe
    patterns:
      - pattern: $F($X)
      - metavariable-regex:
          metavariable: $F
          regex: "^(mark_safe|safestring\\.mark_safe|django\\.utils\\.safestring\\.mark_safe)$"
      - pattern-not: $F("...")
    message: mark_safe() on non-literal content disables escaping —
      XSS risk if the value is user-controlled.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B703, cwe: 79}

  - id: python-mako-template
    pattern-either:
      - pattern: mako.template.Template(...)
      - pattern: mako.lookup.TemplateLookup(...)
      - pattern: TemplateLookup(...)
    message: Mako templates evaluate Python expressions — rendering
      untrusted input is code execution; prefer a sandboxed engine.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B702, cwe: 94}

  - id: python-weak-crypto-key
    patterns:
      - pattern-either:
          - pattern: rsa.generate_private_key($E, $BITS, ...)
          - pattern: rsa.generate_private_key(..., key_size=$BITS, ...)
          - pattern: dsa.generate_private_key($BITS, ...)
          - pattern: dsa.generate_private_key(..., key_size=$BITS, ...)
      - metavariable-comparison:
          metavariable: $BITS
          comparison: $BITS < 2048
    message: RSA/DSA key under 2048 bits — below current minimums;
      use 3072+ or Ed25519.
    languages: [python]
    severity: WARNING
    metadata: {source: bandit, ref: B505, cwe: 326}
