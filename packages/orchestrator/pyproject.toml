[project]
name = "pr-review-orchestrator"
version = "0.1.0"
description = "Stateful LangGraph orchestrator that reviews PRs using deterministic MCP tools and guarantees process cleanup"
requires-python = ">=3.11"
dependencies = [
    "quality-gate-mcp",
    "httpx>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
pr-review = "pr_review_orch.__main__:main"
qg-ingress = "pr_review_orch.ingress:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_orch"]

[tool.uv.sources]
quality-gate-mcp = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# FR-P21: e2e failure-matrix tests are hermetic but marked so they can
# be selected (`pytest -m e2e`) or skipped (`pytest -m "not e2e"`).
markers = [
    "e2e: failure-matrix end-to-end coverage of the service path",
]
