[project]
name = "pr-review-orchestrator"
version = "0.1.0"
description = "Stateful LangGraph orchestrator that reviews PRs using deterministic MCP tools and guarantees process cleanup"
requires-python = ">=3.11"
dependencies = [
    "quality-gate-mcp",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
pr-review = "pr_review_orch.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_orch"]

[tool.uv.sources]
quality-gate-mcp = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
