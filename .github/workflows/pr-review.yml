name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false   # never cancel mid-run: cleanup must complete

jobs:
  review:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qualitygate
          POSTGRES_PASSWORD: qualitygate
          POSTGRES_DB: qualitygate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qualitygate -d qualitygate"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: remote/diff helpers need it

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      # Report-only step: the orchestrator's specialists own the verdict;
      # this surfaces the raw signal dict in the job summary for humans.
      - name: Scan diff for vibecoding signals
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, subprocess
          from quality_gate_mcp.tools import analyze_diff
          diff = subprocess.run(
              ["git", "diff", f"origin/{os.environ['GITHUB_BASE_REF']}...HEAD"],
              capture_output=True, text=True, check=False,
          ).stdout
          s = analyze_diff(diff, os.environ.get("PR_BODY", ""))
          print("## Vibecoding signals\n")
          print("```json")
          print(json.dumps({k: v for k, v in s.items() if k != "per_file"}, indent=2))
          print("```")
          if s["secret_candidates"]:
              print("\n**BLOCKER:** possible hardcoded secrets in this diff.")
          PY

      - name: Run autonomous PR review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://qualitygate:qualitygate@localhost:5432/qualitygate
          REPO_PATH: ${{ github.workspace }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uv run --package pr-review-orchestrator \
            python -m pr_review_orch \
            --repo-path "$REPO_PATH" \
            --pr-number "$PR_NUMBER"

      - name: Assert no orphan processes remain
        if: always()
        run: |
          # Fails the job if a validator/scanner process is still alive —
          # the cleanup contract is enforced, not assumed.
          ORPHAN_RE='tsc --noEmit|node --check|compile\(fh\.read|go vet|cargo check|rg --line-number'
          if pgrep -f "$ORPHAN_RE" >/dev/null; then
            echo "orphan validation processes detected" >&2
            pgrep -af "$ORPHAN_RE" >&2
            exit 1
          fi
          echo "no orphan processes"
