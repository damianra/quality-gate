name: bench

# FR-O31: the golden-set benchmark replays the corpus through the real
# deterministic stages inside the sandbox. Periodic rather than per-PR —
# it gates nothing, it measures detection/FP regressions over time. A
# scoped PR trigger still covers changes to the inputs it exercises
# (corpus, vendored ruleset, sandbox image).

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/**"
      - "Dockerfile.sandbox"
      - "packages/orchestrator/src/pr_review_orch/qg-rules/**"
      - "packages/orchestrator/src/pr_review_orch/sectools.py"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build sandbox image
        run: docker build -t qg-sandbox:local -f Dockerfile.sandbox .

      # ubuntu-latest ships docker but not podman; pin the runtime so
      # `auto` can't pick differently if the image ever gains podman.
      - name: Run corpus
        env:
          QG_SANDBOX: docker
        run: |
          uv run python bench/run.py -j 4 \
            --json bench-report.json --md bench-report.md

      - name: Append report to job summary
        if: always()
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: |
            bench-report.json
            bench-report.md
          retention-days: 30
