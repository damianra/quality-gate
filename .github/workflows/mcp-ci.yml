name: mcp-ci

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp-server/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "packages/mcp-server/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run mcp-server tests
        run: uv run pytest packages/mcp-server -v
