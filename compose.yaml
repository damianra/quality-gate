name: quality-gate

services:
  postgres:
    # FR-P14: pinned by index digest (dependabot docker bumps it).
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    environment:
      POSTGRES_USER: qualitygate
      POSTGRES_PASSWORD: qualitygate
      POSTGRES_DB: qualitygate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualitygate -d qualitygate"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Loopback only (FR-P9): local CLI runs reach postgres on
      # localhost:5432, but it is never reachable from outside the host.
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  mcp-server:
    # FR-P9: debug-only — the unauthenticated SSE endpoint exposes
    # spawn_process (arbitrary command execution). Never part of the
    # service stack; opt in with `docker compose --profile debug up -d`.
    profiles: ["debug"]
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      QG_LOG_LEVEL: ${QG_LOG_LEVEL:-INFO}
    # Runs the MCP server over SSE so it can be attached for manual debugging.
    command: ["python", "-m", "quality_gate_mcp.server", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    restart: "no"

  orchestrator:
    build:
      context: .
      dockerfile: packages/orchestrator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATABASE_URL: postgresql://qualitygate:qualitygate@postgres:5432/qualitygate
      REPO_PATH: /work
      PR_NUMBER: ${PR_NUMBER:-}
      DRY_RUN: ${DRY_RUN:-false}
    volumes:
      # Mount the repository under review read-write (needed to run tsc/node --check).
      - ${REPO_UNDER_TEST:-./target-repo}:/work
    restart: "no"

  # --- Service mode (FR-O19..O22): webhook -> clone -> review -> comment -- #

  ingress:
    build:
      context: .
      dockerfile: packages/orchestrator/Dockerfile
    command: ["python", "-m", "pr_review_orch.ingress"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      DATABASE_URL: postgresql://qualitygate:qualitygate@postgres:5432/qualitygate
      QG_ALLOWED_REPOS: ${QG_ALLOWED_REPOS:-}
      QG_INGRESS_HOST: 0.0.0.0     # internal net only; nginx is the public surface
      QG_INGRESS_PORT: 8088
      QG_WORKTREE_ROOT: /var/quality-gate/worktrees
      QG_CLONE_TIMEOUT: ${QG_CLONE_TIMEOUT:-300}
      QG_MAX_WORKTREE_BYTES: ${QG_MAX_WORKTREE_BYTES:-2147483648}
      QG_MAX_CONCURRENT_RUNS: ${QG_MAX_CONCURRENT_RUNS:-2}
      # FR-P12: service mode reviews untrusted checkouts — validators that
      # run PR-controlled code (cargo check -> build.rs, go vet -> cgo)
      # stay off unless the operator explicitly opts in.
      QG_EXEC_VALIDATORS: ${QG_EXEC_VALIDATORS:-0}
      # FR-P19 deployment profiles: the CPU-only default is
      # DETERMINISTIC (empty provider -> zero LLM calls). Opt into the
      # `api` profile by exporting QG_LLM_PROVIDER(+key), or the `local`
      # profile (ollama) only on a GPU host — 8B reasoning on CPU is
      # minutes/call, not viable for interactive review.
      QG_LLM_PROVIDER: ${QG_LLM_PROVIDER:-}
      QG_LLM_MODEL: ${QG_LLM_MODEL:-}
      # Per-role overrides (FR-O15/FR-T5): empty = inherit the base
      # block. JSON mode defaults on for the specialists — reasoning
      # models ignore the JSON findings contract without it.
      QG_LLM_PROVIDER_REVIEW: ${QG_LLM_PROVIDER_REVIEW:-}
      QG_LLM_MODEL_REVIEW: ${QG_LLM_MODEL_REVIEW:-}
      QG_LLM_JSON_MODE_REVIEW: ${QG_LLM_JSON_MODE_REVIEW:-1}
      QG_LLM_PROVIDER_SECURITY: ${QG_LLM_PROVIDER_SECURITY:-}
      QG_LLM_MODEL_SECURITY: ${QG_LLM_MODEL_SECURITY:-}
      QG_LLM_JSON_MODE_SECURITY: ${QG_LLM_JSON_MODE_SECURITY:-1}
      QG_LLM_PROVIDER_QA: ${QG_LLM_PROVIDER_QA:-}
      QG_LLM_MODEL_QA: ${QG_LLM_MODEL_QA:-}
      QG_LLM_JSON_MODE_QA: ${QG_LLM_JSON_MODE_QA:-1}
      QG_LLM_TIMEOUT: ${QG_LLM_TIMEOUT:-300}
      # Local profile: host ollama (full machine resources); the "llm"
      # profile container is the fallback -> http://ollama:11434/v1.
      QG_LLM_BASE_URL: ${QG_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      DRY_RUN: ${DRY_RUN:-false}
    extra_hosts:
      # Resolve the host ollama from inside the container (Linux compose).
      - "host.docker.internal:host-gateway"
    volumes:
      - worktrees:/var/quality-gate/worktrees  # ephemeral qg-* clones
    expose:
      - "8088"  # compose network only — never published
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - ingress
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Loopback only (FR-P9/P10): direct access is for local tunnels and
      # debugging; the public surface in production is caddy on :443.
      - "127.0.0.1:${QG_INGRESS_PORT:-8089}:8089"
    restart: unless-stopped

  # Public TLS endpoint (FR-P10): the ONLY internet-facing port in
  # production. Caddy terminates TLS (auto certificates), then proxies to
  # the rate-limiting nginx on the internal network:
  #   GitHub --HTTPS:443--> caddy --> nginx:8089 --> ingress:8088
  # Opt-in profile so the local-tunnel path keeps working without a
  # domain: `docker compose --profile tls up -d`
  caddy:
    profiles: ["tls"]
    image: caddy:2.11-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    depends_on:
      - nginx
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"    # ACME http-01 challenge + HTTPS redirect
      - "443:443"
    restart: unless-stopped

  # Fallback LLM when the host has no ollama of its own (the ingress
  # defaults to host.docker.internal). With this profile on, set
  #   QG_LLM_BASE_URL=http://ollama:11434/v1
  # and pull the model once:
  #   docker compose exec ollama ollama pull qwen3:8b
  ollama:
    # FR-P14: `latest` frozen to a digest — the tag moves, the build
    # doesn't. Dependabot refreshes the digest.
    image: ollama/ollama:latest@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["llm"]
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped

volumes:
  pgdata:
  worktrees:
  ollama-models:
  caddy-data:
  caddy-config:
