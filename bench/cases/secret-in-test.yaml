id: secret-in-test
title: gitleaks downgrades a secret inside a test file
tags: [security, gitleaks]
requires: sandbox
files:
  tests/test_token.py: |
    SAMPLE = "ghp_a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8"
    def test_shape():
        assert SAMPLE.startswith("ghp_")
expect:
  findings:
    - agent: security
      severity: warning
      match: committed secret
