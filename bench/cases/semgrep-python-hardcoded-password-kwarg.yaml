id: semgrep-python-hardcoded-password-kwarg
title: semgrep flags hardcoded password kwarg
tags: [security, semgrep, sast]
requires: sandbox
files:
  app/target.py: |
    import psycopg2
    conn = psycopg2.connect(host="db", password="hunter2")
expect:
  findings:
    - agent: security
      severity: info
      match: python-hardcoded-password-kwarg
