id: inline-nosem
title: inline # nosem cannot hide eval() (adversarial)
tags: [security, semgrep, adversarial, suppression]
requires: sandbox
files:
  app/hooks.py: |
    def dynamic(expr):
        return eval(expr)  # nosem
expect:
  findings:
