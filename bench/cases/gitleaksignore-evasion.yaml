id: gitleaksignore-evasion
title: repo-shipped .gitleaksignore cannot mute the scan (adversarial)
tags: [security, gitleaks, adversarial, suppression]
requires: sandbox
files:
  app/config.py: |
    GITHUB_TOKEN = "ghp_a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6q7R8"
  .gitleaksignore: |
    app/config.py
expect:
  findings:
    - agent: security
      severity: blocker
      match: committed secret
    - agent: security
      severity: warning
      match: scanner ignore file added
    - agent: security
      severity: info
      match: scanner ignore/config file present
extra_files:
  .semgrepignore: |
    *.py
