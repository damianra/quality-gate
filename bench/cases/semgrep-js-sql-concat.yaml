id: semgrep-js-sql-concat
title: semgrep flags SQL string concat
tags: [security, semgrep, sast]
requires: sandbox
files:
  src/target.js: |
    db.query("SELECT * FROM u WHERE id=" + uid);
    db.query(`SELECT * FROM u WHERE id=${uid}`);
expect:
  findings:
    - agent: security
      severity: info
      match: js-sql-string-concat
