id: semgrep-python-paramiko-autoadd
title: semgrep flags paramiko AutoAddPolicy
tags: [security, semgrep, sast]
requires: sandbox
files:
  app/target.py: |
    import paramiko
    client = paramiko.SSHClient()
    client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
expect:
  findings:
    - agent: security
      severity: info
      match: python-paramiko-autoadd-policy
