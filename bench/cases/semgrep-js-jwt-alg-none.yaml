id: semgrep-js-jwt-alg-none
title: semgrep flags jwt.verify allows alg none
tags: [security, semgrep, sast]
requires: sandbox
files:
  src/auth.js: |
    const jwt = require("jsonwebtoken");
    jwt.verify(tok, key, {algorithms: ["none", "HS256"]});
expect:
  findings:
    - agent: security
      severity: warning
      match: js-jwt-alg-none
