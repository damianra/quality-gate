id: semgrep-python-hardcoded-password-default
title: semgrep flags a credential literal as a keyword default
tags: [security, semgrep, sast]
requires: sandbox
files:
  app/client.py: |
    def connect(host, password="letmein"):
        return (host, password)
expect:
  findings:
    - agent: security
      severity: info
      match: python-hardcoded-password-default
