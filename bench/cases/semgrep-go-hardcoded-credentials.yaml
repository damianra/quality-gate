id: semgrep-go-hardcoded-credentials
title: semgrep flags a credential literal bound to a secret-named var
tags: [security, semgrep, sast]
requires: sandbox
files:
  cmd/seed/main.go: |
    package main
    const apiToken = "sk_live_9f2a77"
    func main() { _ = apiToken }
expect:
  findings:
    - agent: security
      severity: info
      match: go-hardcoded-credentials
