id: semgrep-python-hardcoded-password-string
title: semgrep flags a credential literal assigned to a secret-named variable
tags: [security, semgrep, sast]
requires: sandbox
files:
  app/settings.py: |
    def load():
        api_token = "sk_live_9f2a77"
        return api_token
expect:
  findings:
    - agent: security
      severity: info
      match: python-hardcoded-password-string
