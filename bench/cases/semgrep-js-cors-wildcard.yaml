id: semgrep-js-cors-wildcard
title: semgrep flags CORS wildcard
tags: [security, semgrep, sast]
requires: sandbox
files:
  src/target.js: |
    app.use(cors({origin: "*"}));
    res.set("Access-Control-Allow-Origin", "*");
expect:
  findings:
    - agent: security
      severity: info
      match: js-cors-wildcard
