# GitHub webhook ingress proxy — FR-O22 public-exposure hardening.
# The public port terminates here; the review backend (uvicorn) only
# listens on the internal network / loopback.
# Controls: per-IP rate limit, 1 MB body cap, only the webhook and
# health paths are forwarded — everything else gets 404.

worker_processes auto;

events {
    worker_connections 256;
}

http {
    server_tokens off;

    # 10 r/s per client IP; up to 20 queued requests delayed, rest 503.
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;

    upstream qg_ingress {
        server ingress:8088;  # compose service name -> uvicorn
    }

    server {
        listen 8089;

        # pull_request payloads are small (spec cap: 1 MB).
        client_max_body_size 1m;

        location /github/webhook {
            limit_req zone=webhook burst=20;
            proxy_pass http://qg_ingress;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /healthz {
            proxy_pass http://qg_ingress;
        }
    }
}
